# cf1000-led.conf - ORICO CF1000 NAS LED daemon configuration
#
# This file will NOT be overwritten when the software is updated.
# The original defaults are always at:
#   /usr/share/cf1000-led/cf1000-led.conf.default
#
# Format: key = value  (section headers [like this] are ignored)
# Comments start with #


# ---------------------------------------------------------------------------
# Polling intervals
# ---------------------------------------------------------------------------

# How often to re-check drive presence and ZFS pool membership (seconds).
# Lower = faster response to hot-swap events. 15s is a reasonable default.
poll_interval_s = 15

# How often to run SMART attribute checks (seconds).
# SMART queries are passive (no disk activity) but will spin up a drive
# that is in standby unless smart_respect_standby = true.
# 300s (5 min) is a good balance between responsiveness and leave-it-alone.
smart_interval_s = 300


# ---------------------------------------------------------------------------
# Flash timing
# ---------------------------------------------------------------------------

# Full period for fast flash (drive SMART failure): milliseconds.
# 250ms = 2 flashes per second. Urgent.
fast_period_ms = 250

# Full period for slow flash (drive SMART warning): milliseconds.
# 1000ms = 1 flash per second. Notable but not alarming.
slow_period_ms = 1000


# ---------------------------------------------------------------------------
# Data sources
# ---------------------------------------------------------------------------

# Enable ZFS pool membership detection via 'zpool status -vPL'.
# When enabled, a drive that is expected in a pool but not present
# will show solid red. Requires zfsutils-linux (or equivalent).
zfs_enabled = true

# Enable SMART health monitoring via 'smartctl'.
# Requires smartmontools.
smart_enabled = true


# ---------------------------------------------------------------------------
# SMART behaviour
# ---------------------------------------------------------------------------

# If true, skip SMART checks for drives that are in standby/sleep mode.
# This avoids spinning up drives just to read SMART data.
# Requires smartmontools 6.0+ (uses smartctl -n standby).
# Set to false if you never spin down drives (e.g. ZFS pool members).
smart_respect_standby = true


# ---------------------------------------------------------------------------
# Network indicator LED - traffic activity
# ---------------------------------------------------------------------------
# Samples /proc/net/dev every 50ms across ALL interfaces except loopback.
# No interface names to configure — it just works.
#
# LED behaviour:
#   tx only  -> blue   (outbound traffic)
#   rx only  -> red    (inbound traffic)
#   both     -> purple (bidirectional)
#   idle     -> off
#
# net_threshold: minimum bytes per 50ms tick to trigger the LED.
# Default 64 bytes filters idle keepalives and ARP noise.
# Set to 1 to trigger on any traffic at all.
net_threshold = 64


# ---------------------------------------------------------------------------
# System indicator LED - disk I/O activity
# ---------------------------------------------------------------------------
# The system LED reflects aggregate read/write activity across all
# sd* and nvme* devices by sampling /proc/diskstats every 50ms.
#
# LED behaviour:
#   reads  only  -> blue
#   writes only  -> red
#   both         -> purple
#   idle         -> off
#
# io_threshold: minimum sectors transferred per 50ms tick to light the LED.
# 1 sector = 512 bytes. Default of 1 means any activity triggers the LED.
# Raise this value if background ZFS activity causes constant flickering.
# Example: 64 = 32KB per tick minimum before triggering.
io_threshold = 1
