# dkms.conf - rebuilds orico_cf1000_leds.ko automatically for every new kernel.
#
# Installed to /usr/src/orico-cf1000-leds-<version>/ by `make install` (or
# `make dkms-install`).  Keep PACKAGE_VERSION in step with MODULE_VERSION
# in orico_cf1000_leds.c; the Makefile reads the version from this file.
PACKAGE_NAME="orico-cf1000-leds"
PACKAGE_VERSION="1.0.0"
BUILT_MODULE_NAME[0]="orico_cf1000_leds"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
AUTOINSTALL="yes"
